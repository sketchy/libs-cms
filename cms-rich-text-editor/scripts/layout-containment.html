<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PENDING</title>
  <style id="layout-css"></style>
</head>
<body>
  <div id="mount">
    <div class="root" data-test-id="rich-text-editor">
      <div class="toolbarSlot">toolbar</div>
          <div class="editorSlot">
            <div class="editor" contenteditable="true" id="editor"></div>
          </div>
    </div>
  </div>
  <pre id="result" style="display:none"></pre>
  <script>
    const params = new URLSearchParams(location.search)
    const mode = params.get('mode') || 'current'

    const currentCss = `
      html, body { height: 100%; overflow: hidden; margin: 0; }
      body > div { height: 100%; overflow: hidden; margin: 0; }
      .root {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }
      .toolbarSlot { flex-shrink: 0; height: 40px; background: #ddd; }
      .editorSlot {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .editor {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 20px;
        background: #fff;
      }
    `

    const fixedCss = `
      html, body {
        height: 100%;
        max-height: 100%;
        overflow: hidden;
        margin: 0;
      }
      #mount {
        position: absolute;
        inset: 0;
        overflow: hidden;
        margin: 0;
      }
      .root {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }
      .toolbarSlot { flex-shrink: 0; height: 40px; background: #ddd; }
      .editorSlot {
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: hidden;
      }
      .editor {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 20px;
        background: #fff;
        outline: none;
      }
    `

    document.getElementById('layout-css').textContent = mode === 'fixed' ? fixedCss : currentCss
    const editorEl = document.getElementById('editor')
    editorEl.innerHTML = Array.from(
      { length: 40 },
      (_, i) => `<p>Line ${i + 1} of pasted content that exceeds the fold.</p>`
    ).join('')
    // Slate applies these as inline styles. Fixed mode must override them.
    Object.assign(editorEl.style, mode === 'fixed'
      ? {
          position: 'absolute',
          top: '0',
          right: '0',
          bottom: '0',
          left: '0',
          overflowY: 'auto',
          overscrollBehavior: 'contain',
        }
      : {
          position: 'relative',
          whiteSpace: 'pre-wrap',
          wordWrap: 'break-word',
        }
    )

    requestAnimationFrame(() => {
      const editorSlot = document.querySelector('.editorSlot')
      const editor = document.querySelector('.editor')
      const html = document.documentElement
      const inner = window.innerHeight
      const htmlScroll = html.scrollHeight
      const overflowY = (el) => getComputedStyle(el).overflowY
      const canScroll = (el) =>
        el.scrollHeight > el.clientHeight + 1 && ['auto', 'scroll'].includes(overflowY(el))

      const documentGrew = htmlScroll > inner + 1
      const editorGrewPastSlot = editor.clientHeight > editorSlot.clientHeight + 1
      const innerCanScroll = canScroll(editorSlot) || canScroll(editor)
      const pass = !documentGrew && innerCanScroll && !editorGrewPastSlot

      const result = {
        mode,
        innerHeight: inner,
        htmlScrollHeight: htmlScroll,
        bodyScrollHeight: document.body.scrollHeight,
        documentGrew,
        editorGrewPastSlot,
        editorSlot: {
          clientHeight: editorSlot.clientHeight,
          scrollHeight: editorSlot.scrollHeight,
          overflowY: overflowY(editorSlot),
        },
        editor: {
          clientHeight: editor.clientHeight,
          scrollHeight: editor.scrollHeight,
          overflowY: overflowY(editor),
        },
        innerCanScroll,
        pass,
      }

      document.getElementById('result').textContent = JSON.stringify(result)
      document.title = pass ? 'PASS' : 'FAIL'
    })
  </script>
</body>
</html>
